# === Application Info ===
spring.application.name=${SPRING_APPLICATION_NAME}

# === DataSource Configuration ===
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# === Hibernate / JPA ===
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

# === HikariCP SSL Settings ===
spring.datasource.hikari.data-source-properties.ssl=${SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSL}
spring.datasource.hikari.data-source-properties.sslmode=${SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLMODE}

# === Redis Configuration ===
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# === Mail ===
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.default-encoding=${SPRING_MAIL_DEFAULT_ENCODING}

# === JWT Secret ===
jwt.secret=${JWT_SECRET}

# === Logging (Reduce log noise) ===
logging.level.org.hibernate.orm.boot.spi.BootstrapContextImpl=${LOGGING_LEVEL_ORG_HIBERNATE_ORM_BOOT_SPI_BOOTSTRAPCONTEXTIMPL}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_CONFIG_ANNOTATION_AUTHENTICATION_CONFIGURATION_INITIALIZEUSERDETAILSBEANMANAGERCONFIGURER}
logging.level.org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_REPOSITORY_CONFIG_REPOSITORYCONFIGURATIONEXTENSIONSUPPORT}
